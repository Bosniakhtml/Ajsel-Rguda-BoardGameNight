name: Build and test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore BoardGameNight.sln

      - name: Build solution
        run: dotnet build BoardGameNight.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test BoardGameNight.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
